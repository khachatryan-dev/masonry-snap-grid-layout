name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The layout algorithm once existed in three divergent copies, so a fix
      # landed in React and never reached Vue. Structure alone does not prevent
      # that returning — this does.
      - name: Check architecture boundaries
        run: npm run check:arch

      # Each adapter is typechecked with its own compiler. The Angular
      # component ships as TypeScript source and compiles in the consumer's
      # build, so a type error there would surface as a broken install.
      - name: Typecheck (core + React)
        run: npm run typecheck:core

      - name: Typecheck (Angular)
        run: npm run typecheck:angular

      - name: Typecheck (Vue SFC)
        run: npm run typecheck:vue

      # The demo apps are the first thing a prospective user runs. Typechecking
      # them against local source means a renamed prop breaks CI rather than
      # quietly leaving a broken demo in the repo.
      - name: Typecheck (example apps)
        run: npm run typecheck:examples

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build:
    name: Build & Size
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          echo "── dist contents ──────────────────────────────"
          ls -lh dist/ dist/react/ dist/vue/ 2>/dev/null || true
          echo "───────────────────────────────────────────────"
          [ -f dist/index.js ]       || (echo "❌ dist/index.js missing"       && exit 1)
          [ -f dist/react/index.js ] || (echo "❌ dist/react/index.js missing" && exit 1)
          [ -f dist/vue/index.js ]   || (echo "❌ dist/vue/index.js missing"   && exit 1)
          [ -f dist/style.css ]      || (echo "❌ dist/style.css missing"      && exit 1)
          [ -f dist/index.d.ts ]     || (echo "❌ dist/index.d.ts missing"     && exit 1)
          [ -f dist/react/index.d.ts ] || (echo "❌ dist/react/index.d.ts missing" && exit 1)
          echo "✅ All required dist files present"

      - name: Check bundle size
        run: npm run size

      # The ./angular entry publishes TypeScript source that compiles in the
      # consumer's build. Nothing in the working tree can reveal a missing
      # file there, because the source is present locally — only the packed
      # tarball tells the truth.
      - name: Verify the published package resolves
        run: npm run check:package

      - name: List published contents
        run: npm pack --dry-run
